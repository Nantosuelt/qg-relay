<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-jeYpTIqnJPRwgxQ2tsZk/YZUQkLIDQ6GUIQKylO/hg0='; style-src 'unsafe-inline'">
<title>QG · retour de la banque</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:0 20px;color:#222}code{background:#f2f2f2;padding:1px 4px;border-radius:4px;word-break:break-all}</style>
</head>
<body>
<h1>Retour vers QG…</h1>
<p>Cette page renvoie le retour de votre banque vers QG sur votre ordinateur (<code>127.0.0.1:4848</code>). Rien n’est conservé ici.</p>
<p id="aide" hidden>Si QG ne s’ouvre pas, copiez l’adresse de cette page et collez-la dans QG › Compta › Banques › « Le retour de la banque n’a pas abouti ? ».</p>
<script>
(function () {
  var CIBLE = 'http://127.0.0.1:4848/api/compta/enablebanking/callback';
  var src = new URLSearchParams(location.search), out = new URLSearchParams();
  ['code', 'state', 'error', 'error_description'].forEach(function (k) { if (src.has(k)) out.set(k, src.get(k)); });
  document.getElementById('aide').hidden = false;
  if (out.has('state') && (out.has('code') || out.has('error'))) location.replace(CIBLE + '?' + out.toString());
})();
</script>
</body>
</html>
